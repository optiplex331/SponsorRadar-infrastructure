# Product image, referenced only by digest.
image:
  repository: ghcr.io/optiplex331/sponsor-radar
  # Filled after the first product CI build on main. Release = bump this line.
  # docker buildx imagetools inspect ghcr.io/optiplex331/sponsor-radar:main --format '{{ .Manifest.Digest }}'
  digest: sha256:a087e74d618fcee12b81d8a8b015ffb4b73b190eefead0219da6907053834ec8

# Public hostname served through the sponsor-radar Cloudflare Tunnel.
hostname: sponsorradar.halligalli.games

tunnel:
  # Filled after `cloudflared tunnel create sponsor-radar` (the tunnel UUID).
  id: de9806b4-7891-4ecc-8047-2de4893e7a7d

web:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

collector:
  schedule: "0 5 * * *"
  timeZone: Etc/UTC
  activeDeadlineSeconds: 3600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

postgres:
  # postgres:18-alpine, multi-arch index digest.
  image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  storageClassName: local-path
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

cloudflared:
  # cloudflare/cloudflared:2026.9.3, multi-arch index digest.
  image: docker.io/cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
