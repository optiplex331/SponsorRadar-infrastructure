# Ingress only. Egress stays open on purpose: the collector fetches public ATS
# APIs and the IND register, and cloudflared dials out to Cloudflare.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "sr.labels" "network" | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-app
  labels:
    {{- include "sr.labels" "network" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sr.selector" "postgres" | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [sponsor-radar]
              - key: app.kubernetes.io/component
                operator: In
                values: [web, collector]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-cloudflared
  labels:
    {{- include "sr.labels" "network" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sr.selector" "web" | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sr.selector" "cloudflared" | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
