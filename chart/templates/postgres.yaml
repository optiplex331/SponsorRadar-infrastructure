apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "sr.labels" "postgres" | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "sr.selector" "postgres" | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "sr.labels" "postgres" | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "sr.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sr.labels" "postgres" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # uid/gid 70 is the postgres user in the alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: radar
            - name: POSTGRES_DB
              value: radar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sponsor-radar-postgres
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "radar", "-d", "radar"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "radar", "-d", "radar"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "sr.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Postgres 18 image: PGDATA=/var/lib/postgresql/18/docker under this mount.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "sr.labels" "postgres" | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
