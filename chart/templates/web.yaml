apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "sr.labels" "web" | nindent 4 }}
spec:
  selector:
    {{- include "sr.selector" "web" | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "sr.labels" "web" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sr.selector" "web" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sr.labels" "web" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "sr.appPodSecurity" . | nindent 8 }}
      # Migrations run here, not in an Argo PreSync hook: PreSync would run before
      # postgres exists on the first sync. `migrate` takes a pg_advisory_lock.
      initContainers:
        - name: migrate
          image: {{ include "sr.image" . }}
          args: ["sponsor-radar", "migrate"]
          env:
            {{- include "sr.dbEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "sr.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: web
          image: {{ include "sr.image" . }}
          env:
            {{- include "sr.dbEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "sr.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
