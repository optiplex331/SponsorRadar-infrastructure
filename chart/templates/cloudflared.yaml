apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    {{- include "sr.labels" "cloudflared" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sr.selector" "cloudflared" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sr.labels" "cloudflared" | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/cloudflared-config.yaml") . | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      # The cloudflared image runs as the distroless nonroot user (65532).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image }}
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
          securityContext:
            {{- include "sr.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: creds
          secret:
            secretName: sponsor-radar-tunnel
            items:
              - key: credentials.json
                path: credentials.json
